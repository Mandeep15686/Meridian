[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "1.0.3"
description = "Multimodal Regulatory Intelligence & Compliance Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.4",
    "pydantic-settings==2.2.1",

    # Async / task queue
    "celery[redis]==5.4.0",
    "redis==5.0.4",
    "httpx==0.27.0",
    "anyio==4.3.0",

    # LangChain / LangGraph
    "langchain==0.2.1",
    "langgraph==0.2.0",
    "langchain-anthropic==0.1.15",
    "langchain-openai==0.1.8",
    "langsmith>=0.1.112,<0.2.0",

    # LlamaIndex (RAG)
    "llama-index==0.10.40",
    "llama-index-embeddings-openai==0.1.10",
    "llama-index-vector-stores-postgres==0.1.12",

    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pgvector==0.2.5",
    "alembic==1.13.1",

    # Anthropic
    "anthropic==0.30.1",

    # HuggingFace
    "huggingface-hub==0.23.0",
    "transformers==4.41.0",
    "sentence-transformers==3.0.0",
    "tokenizers==0.19.1",

    # Audio processing
    "openai-whisper>=20240930",
    "librosa==0.10.2",
    "webrtcvad==2.0.10",
    "pydub==0.25.1",
    "mutagen==1.47.0",

    # Vision / image
    "Pillow==10.3.0",
    "pdf2image==1.17.0",
    "python-magic==0.4.27",

    # Document processing
    "pypdf==4.2.0",
    "python-docx==1.1.2",
    "openpyxl==3.1.3",
    "pandas==2.2.2",
    "numpy==1.26.4",

    # ML / tabular
    "scikit-learn==1.4.2",
    "chronos-forecasting==1.3.0",
    "torch==2.3.0",

    # Report generation
    "weasyprint==62.1",
    "Jinja2==3.1.4",
    "markdown==3.6",

    # Storage
    "google-cloud-storage==2.17.0",

    # Eval / observability
    "ragas==0.1.10",
    "mlflow==2.13.0",
    "wandb==0.17.0",
    "sentry-sdk[fastapi]==2.5.0",

    # Utilities
    "ulid-py==1.1.0",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "tenacity==8.3.0",
    "structlog==24.2.0",
    "rich==13.7.1",
    "typer==0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "pytest-timeout==2.3.1",
    "httpx==0.27.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "black==24.4.2",
    "pre-commit==3.7.1",
    "pip-audit==2.7.3",
    "detect-secrets==1.4.0",
    "locust==2.29.0",
    "ipykernel==6.29.4",
]

[project.scripts]
meridian = "src.api.main:app"
meridian-worker = "src.api.worker:start"
meridian-ingest = "scripts.ingest_corpus:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: no external dependencies",
    "integration: requires Docker Compose stack",
    "slow: takes more than 5 seconds",
    "eval: part of the eval harness",
    "gpu: requires GPU",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/ui/*",
    "src/api/*",
    "src/db/*",
    "src/eval/*",
    "src/models/*",
    "src/storage/*",
    "src/agents/data_agent.py",
    "src/agents/vision_agent.py",
    "src/rag/ingest.py",
    "src/rag/corpus/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
